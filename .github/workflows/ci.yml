name: CI

on:
  push:
    branches: [main, ci/mettre-en-place-le-pipeline]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & tests
    runs-on: ubuntu-latest
  quality:
    name: Analyse SonarQube
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Analyse avec SonarQube Cloud
        working-directory: taskops-api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./mvnw -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Construire et tester
        working-directory: taskops-api
        run: ./mvnw -B verify

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            taskops-api/target/surefire-reports/
            taskops-api/target/site/jacoco/
          retention-days: 7
